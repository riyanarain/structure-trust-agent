[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strustagent"
version = "0.1.0"
description = "Agent that judges which parts of a predicted protein structure can be trusted, with an image versus text evidence comparison"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "biopython>=1.80",
  "requests",
]

[project.optional-dependencies]
gemini = ["google-genai"]
openai = ["openai"]
esm = ["torch", "transformers"]
dev = ["pytest"]

[project.scripts]
strustagent = "strustagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
